apiVersion: v1
kind: Service
metadata:
  annotations: {}
  name: photo-ui
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: photo-ui
  sessionAffinity: None
  type: ClusterIP
