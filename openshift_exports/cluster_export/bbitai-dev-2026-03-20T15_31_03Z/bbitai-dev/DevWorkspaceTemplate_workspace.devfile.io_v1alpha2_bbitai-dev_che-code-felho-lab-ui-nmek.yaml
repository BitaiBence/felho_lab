apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspaceTemplate
metadata:
  annotations:
    che.eclipse.org/components-update-policy: managed
    che.eclipse.org/plugin-registry-url: http://127.0.0.1:8080/dashboard/api/editors/devfile?che-editor=che-incubator/che-code/latest
  name: che-code-felho-lab-ui-nmek
  ownerReferences:
  - apiVersion: workspace.devfile.io/v1alpha2
    kind: devworkspace
    name: felho-lab-ui-nmek
    uid: 41185428-3d72-4f9e-9943-8000b2a63359
spec:
  commands:
  - apply:
      component: che-code-injector
    id: init-container-command
  - exec:
      commandLine: nohup /checode/entrypoint-volume.sh > /checode/entrypoint-logs.txt
        2>&1 &
      component: che-code-runtime-description
    id: init-che-code-command
  components:
  - container:
      command:
      - /entrypoint-init-container.sh
      cpuLimit: 500m
      cpuRequest: 30m
      env:
      - name: CHE_DASHBOARD_URL
        value: https://devspaces.apps.rm3.7wse.p1.openshiftapps.com
      - name: CHE_PLUGIN_REGISTRY_URL
        value: ""
      - name: CHE_PLUGIN_REGISTRY_INTERNAL_URL
        value: ""
      - name: CLUSTER_CONSOLE_URL
        value: https://console-openshift-console.apps.rm3.7wse.p1.openshiftapps.com
      - name: CLUSTER_CONSOLE_TITLE
        value: OpenShift console
      - name: OPENVSX_REGISTRY_URL
        value: https://open-vsx.org
      image: registry.redhat.io/devspaces/code-rhel9@sha256:5cd4fe568b4352bc5ef6ec0b16c3235fe515c2afb86fb076ed435cea65ea2247
      memoryLimit: 256Mi
      memoryRequest: 32Mi
      sourceMapping: /projects
      volumeMounts:
      - name: checode
        path: /checode
    name: che-code-injector
  - attributes:
      app.kubernetes.io/component: che-code-runtime
      app.kubernetes.io/part-of: che-code.eclipse.org
      controller.devfile.io/container-contribution: true
    container:
      cpuLimit: 500m
      cpuRequest: 30m
      endpoints:
      - attributes:
          cookiesAuthEnabled: true
          discoverable: false
          type: main
          urlRewriteSupported: true
        exposure: public
        name: che-code
        protocol: https
        secure: true
        targetPort: 3100
      - attributes:
          discoverable: false
          urlRewriteSupported: false
        exposure: public
        name: code-redirect-1
        protocol: https
        targetPort: 13131
      - attributes:
          discoverable: false
          urlRewriteSupported: false
        exposure: public
        name: code-redirect-2
        protocol: https
        targetPort: 13132
      - attributes:
          discoverable: false
          urlRewriteSupported: false
        exposure: public
        name: code-redirect-3
        protocol: https
        targetPort: 13133
      env:
      - name: CHE_DASHBOARD_URL
        value: https://devspaces.apps.rm3.7wse.p1.openshiftapps.com
      - name: CHE_PLUGIN_REGISTRY_URL
        value: ""
      - name: CHE_PLUGIN_REGISTRY_INTERNAL_URL
        value: ""
      - name: CLUSTER_CONSOLE_URL
        value: https://console-openshift-console.apps.rm3.7wse.p1.openshiftapps.com
      - name: CLUSTER_CONSOLE_TITLE
        value: OpenShift console
      - name: OPENVSX_REGISTRY_URL
        value: https://open-vsx.org
      image: registry.redhat.io/devspaces/udi-rhel9@sha256:024712461154d505de3180f4459363c46bc5d0fe7465d7e270108540ce8902fe
      memoryLimit: 1024Mi
      memoryRequest: 256Mi
      sourceMapping: /projects
      volumeMounts:
      - name: checode
        path: /checode
    name: che-code-runtime-description
  - name: checode
    volume: {}
  events:
    postStart:
    - init-che-code-command
    preStart:
    - init-container-command
